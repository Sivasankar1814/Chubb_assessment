<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 790" width="1040" height="790" role="img" aria-label="Technology stack. Backend: Java 21 and Maven; Spring Cloud Gateway, springdoc-openapi and Actuator at the edge; Spring Boot 3.3.5 MVC, Spring Cloud OpenFeign, Bean Validation and a shared common library in the services; Spring Security with an OAuth2 resource server, JWT HS256 and BCrypt; Spring Data JPA with Hibernate, H2 and optional MySQL, one database per service; JUnit 5, Mockito, Spring Boot Test and spring-security-test. Frontend: Angular 22 with standalone components, signals and no zone.js, Angular Material 3, TypeScript 6 and RxJS 7; quality and delivery with Vitest, Playwright, ESLint with Prettier, and nginx with a Content-Security-Policy in a Docker image that has not been built yet. Four services, one web app, eight claim statuses, three roles and six APAC markets.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1040" height="790" rx="18" fill="url(#bg)"/>

