server:
  port: 8083

spring:
  application:
    name: claim-service
  datasource:
    url: jdbc:h2:mem:claimdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
