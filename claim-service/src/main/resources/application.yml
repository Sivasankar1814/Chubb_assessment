server:
  port: 8083

spring:
  application:
    name: claim-service
  datasource:
    url: jdbc:h2:mem:claimdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

# Seed 14 demo claims (all six markets) when the claims table is empty. They use the demo user ids from user-service,
# so set this to false wherever chubb.seed-demo-users is false.
chubb:
  seed-demo-claims: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
