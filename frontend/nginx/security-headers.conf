# Included by every location, because an add_header inside a location replaces all the server-level ones.
#
# style-src needs 'unsafe-inline': Angular Material sets inline styles on its overlays and form fields.
# Scripts, fonts and the API are all same-origin, so nothing else is allowed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Strict-Transport-Security is set where TLS ends (the load balancer or ingress), not here.
